name: Import Trigger.dev complete source snapshot

# One-time push trigger plus manual rerun. Standard runners are free for public repositories.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-trigger-dev-source.yml']

permissions:
  contents: write

concurrency:
  group: trigger-dev-source-import
  cancel-in-progress: false

jobs:
  import-current-upstream-source:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check source branch does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/trigger-dev-upstream-snapshot >/dev/null 2>&1; then
            echo "::error::Snapshot branch exists. This import will not overwrite it."
            exit 1
          fi

      - name: Download complete tracked files from Trigger.dev main (not full history)
        run: |
          set -euo pipefail
          git -c protocol.version=2 clone \
            --depth=1 --single-branch --branch main --filter=blob:none \
            https://github.com/triggerdotdev/trigger.dev.git upstream
          cd upstream
          git fetch --depth=1 origin 2fbd5c7cf4e9c8e19b88e2b72a7133795611e33d
          git checkout --detach 2fbd5c7cf4e9c8e19b88e2b72a7133795611e33d
          test "$(git rev-parse HEAD)" = "2fbd5c7cf4e9c8e19b88e2b72a7133795611e33d"
          git rev-parse HEAD > ../UPSTREAM_COMMIT
          git rev-parse 'HEAD^{tree}' > ../UPSTREAM_TREE
          git ls-tree -r --name-only HEAD | wc -l | tee ../UPSTREAM_TRACKED_FILE_COUNT
          if [ -f .gitmodules ]; then
            echo "::warning::Upstream contains submodules: their content is not included in the Git superproject snapshot."
            cat .gitmodules
          fi
          if [ -f .gitattributes ] && grep -Eq 'filter=lfs' .gitattributes; then
            echo "::warning::Upstream declares Git LFS paths; verify that binary LFS objects are available separately."
          fi

      - name: Prepare complete upstream source under isolated upstream/ directory
        run: |
          set -euo pipefail
          cd upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          UPSTREAM_TREE="$(cat ../UPSTREAM_TREE)"
          git checkout --orphan trigger-dev-upstream-snapshot
          git read-tree --empty
          git read-tree --prefix=upstream/ "$UPSTREAM_TREE"
          IMPORT_TREE="$(git write-tree)"
          SUBTREE="$(git rev-parse "$IMPORT_TREE:upstream")"
          test "$SUBTREE" = "$UPSTREAM_TREE" || { echo "::error::Source subtree differs from upstream"; exit 1; }
          # Upstream is nested under upstream/; original file paths, including
          # upstream/.github/workflows, are data and are preserved unchanged.
          # Commit only the exact preverified index tree. The shallow checkout's
          # original working directory remains present, but MUST NOT be staged.
          test "$(git ls-tree --name-only "$(git write-tree)")" = "upstream"
          git -c core.hooksPath=/dev/null commit -m "Reference source snapshot of triggerdotdev/trigger.dev at $(cat ../UPSTREAM_COMMIT)"
          git fsck --no-reflogs --connectivity-only

      - name: Push snapshot branch to research repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upstream
          git remote add research "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c core.hooksPath=/dev/null push research HEAD:refs/heads/trigger-dev-upstream-snapshot

      - name: Verify uploaded snapshot against upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upstream
          git fetch research trigger-dev-upstream-snapshot --depth=1
          LOCAL_TREE="$(git rev-parse 'HEAD:upstream')"
          REMOTE_TREE="$(git rev-parse 'FETCH_HEAD:upstream')"
          test "${LOCAL_TREE}" = "${REMOTE_TREE}"
          test "${REMOTE_TREE}" = "$(cat ../UPSTREAM_TREE)"
          test "${REMOTE_TREE}" = "c87759655a420817332da8d187a48265f2e41b03"
          echo "Verified matching Git tree: ${REMOTE_TREE}"
          echo "Upstream source commit: $(cat ../UPSTREAM_COMMIT)"
          echo "Source tracked-file count: $(cat ../UPSTREAM_TRACKED_FILE_COUNT)"
          echo "Imported branch: trigger-dev-upstream-snapshot"
